AWSTemplateFormatVersion: "2010-09-09"
Description: Serverless task management web application

Resources:
  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Metadata:
      BlastMap:
        BlastRadiusScore: "7/10"
        Fix: "NONE"
    Properties:
      Name: task-app-api

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Metadata:
      BlastMap:
        BlastRadiusScore: "6/10"
        Fix: "NONE"
    Properties:
      StageName: prod
      RestApiId: !Ref ApiGateway
      TracingEnabled: true
      # X-Ray enabled — recommended integration target

  TaskLambda:
    Type: AWS::Lambda::Function
    Metadata:
      BlastMap:
        BlastRadiusScore: "4/10"
        Fix: "NONE — but add a circuit breaker / retry-with-backoff (Step Functions or code change) around the Stripe Payment API call it makes; that external dependency is the actual SPOF surfaced through this function"
    Properties:
      FunctionName: task-handler
      Runtime: python3.12
      Timeout: 15
      TracingConfig:
        Mode: Active
        # X-Ray active tracing — recommended integration target
      Environment:
        Variables:
          PAYMENT_API_URL: https://api.stripe.com/v1/charges
          # EXTERNAL SPOF — Stripe Payment API: 8/10, no circuit breaker or fallback.
          # Fix: add retry-with-backoff + circuit breaker (Lambda code or Step Functions)
          DB_HOST: !GetAtt AppDatabase.Endpoint.Address

  NotifyLambda:
    Type: AWS::Lambda::Function
    Metadata:
      BlastMap:
        BlastRadiusScore: "3/10"
        Fix: "NONE"
    Properties:
      FunctionName: notification-handler
      Runtime: python3.12
      Timeout: 10
      TracingConfig:
        Mode: Active

  AppDatabase:
    Type: AWS::RDS::DBInstance
    Metadata:
      BlastMap:
        BlastRadiusScore: "9/10"
        Fix: "Enable MultiAZ: true on AWS::RDS::DBInstance"
    Properties:
      DBInstanceClass: db.t3.medium
      Engine: postgres
      MultiAZ: false          # SPOF — every authenticated request depends on this
      AllocatedStorage: 100
    Tags:
      - Key: BlastMapSPOF
        Value: "true"

  TasksTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      BlastMap:
        BlastRadiusScore: "6/10"
        Fix: "Set PointInTimeRecoverySpecification: PointInTimeRecoveryEnabled: true"
    Properties:
      TableName: tasks
      BillingMode: PAY_PER_REQUEST
      # PointInTimeRecoverySpecification not set — data loss risk on bad writes/deletes
    Tags:
      - Key: BlastMapSPOF
        Value: "true"

  NotificationQueue:
    Type: AWS::SQS::Queue
    Metadata:
      BlastMap:
        BlastRadiusScore: "5/10"
        Fix: "Add a RedrivePolicy pointing to a dead-letter queue, plus a CloudWatch alarm on the DLQ's ApproximateNumberOfMessagesVisible"
    Properties:
      QueueName: task-notifications
      # No RedrivePolicy (DLQ) — failed notification deliveries vanish silently
    Tags:
      - Key: BlastMapSPOF
        Value: "true"

  AssetsBucket:
    Type: AWS::S3::Bucket
    Metadata:
      BlastMap:
        BlastRadiusScore: "2/10"
        Fix: "NONE"
    Properties:
      BucketName: task-app-assets
