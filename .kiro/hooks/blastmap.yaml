name: BlastMap Blast Radius Analysis
description: Runs blast radius audit on every CloudFormation change and writes SKILL.md + annotated CFN output
trigger:
  event: file_change
  pattern: "**/*.yaml"
  filter: "CloudFormation"
agent:
  instructions: |
    Run the BlastMap prompt from .kiro/steering/blastmap-prompt.md
    against the changed CloudFormation file.

    Before writing output files:
      Run: git rev-parse --short HEAD
      Use that value as <commit-hash> in output filenames.

    Write the SKILL.md output to .blastmap/SKILL.md
    Write the annotated CFN to .blastmap/<commit-hash>-<original-filename>.yaml
